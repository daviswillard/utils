# ========================================
# Файл конфигурации Kitty для macOS
# Предназначен для пользователей, которые ценят готовый баланс
# красоты и функциональности без лишних сложностей.
# ========================================

# ------------------------------
# 1. ОСНОВНЫЕ НАСТРОЙКИ
# ------------------------------
# Выбираем шрифт. Fira Code популярен из-за лигатур (красивое отображение <=, -> и т.д.)
# Убедитесь, что шрифт установлен в системе. [citation:3][citation:5]
font_family      Fira Code
# Размер шрифта. Для retina-экранов Mac может быть комфортно 14-16.
font_size        11.0

# Отключаем лигатуры, когда курсор находится на слове, чтобы было удобнее редактировать.
# Значение 'cursor' значит, что лигатуры отключаются только для слова под курсором. [citation:1][citation:10]
disable_ligatures cursor

# ------------------------------
# 2. ВНЕШНИЙ ВИД И ПРОЗРАЧНОСТЬ
# ------------------------------
# Включение прозрачности (значения от 0 до 1). 0.8 = 80% непрозрачности. [citation:6]
background_opacity 0.95

# Отступы от краев окна внутри терминала. Делает внешний вид воздушнее. [citation:5]
window_padding_width 10

# Толщина границы окна Kitty. [citation:5]
window_border_width 1pt

# Цвет активной границы (когда окно в фокусе). [citation:5]
active_border_color #4CAF50

# ------------------------------
# 3. ЦВЕТОВАЯ СХЕМА (ТЕМА)
# ------------------------------
# Пример простой темной темы (на основе One Dark). Вы можете заменить эти цвета на свои.
# Определяет основной цвет фона и текста. [citation:3][citation:6]
background       #1a1a2e
foreground       #e2e8f0

# Цвета для 16 стандартных цветов терминала (черный, красный, зеленый, синий и т.д.)
color0           #16213e
color1           #e53170
color2           #4caf50
color3           #ffb86b
color4           #5d9b9b
color5           #bd93f9
color6           #8be9fd
color7           #c0c0c0
color8           #4d4d4d
color9           #ff5555
color10          #50fa7b
color11          #f1fa8c
color12          #7082b8
color13          #ff79c6
color14          #a4ffff
color15          #ffffff

# ------------------------------
# 4. КУРСОР
# ------------------------------
# Форма курсора: beam (вертикальная палочка), block (блок), underline (подчеркивание). [citation:3]
cursor_shape          beam
# Толщина курсора (для beam и underline). [citation:3]
cursor_beam_thickness 2.0
# Цвет курсора. [citation:6]
cursor                #8fee96

# ------------------------------
# 5. ПОВЫШЕНИЕ УДОБСТВА (ХОТКЕИ)
# ------------------------------
# Меняем стандартные сочетания клавиш для копирования/вставки на привычные Cmd+C/Cmd+V.
# Внимание: Это переопределит стандартное поведение shell. [citation:3]
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Удобное управление окнами (сплитами) [citation:5]
# Разделить окно по горизонтали
#map ctrl+alt+h split_window horizontal
# Разделить окно по вертикали
#map ctrl+alt+v split_window vertical

# Переключение между соседними окнами (сплитами)
map cmd+[ neighboring_window left
map cmd+] neighboring_window right
map cmd+shift+[ neighboring_window up
map cmd+shift+] neighboring_window down

# ------------------------------
# 6. РАЗНОЕ
# ------------------------------
# Количество сохраняемых строк для прокрутки назад. [citation:6]
scrollback_lines 10000

# Разрешить открывать выделенный URL по клику. [citation:6]
url_color #d65c9d
url_style curly
detect_urls yes

# Визуальный стиль верхней панели с вкладками. [citation:3][citation:5]
tab_bar_style powerline
